name: Offline component tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy==2.2.6 pandas==2.2.3 scipy==1.16.2 scikit-learn==1.6.1
      - run: pip install -e . --no-deps
      - run: python -m unittest discover -s tests -v
